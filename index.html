<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./src/images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>Article preview component</title>
</head>
<body>
    <main>
        <section class="img-container">
            <img src="./src/images/drawers.jpg" alt="Drawer image">
        </section>
        <section class="text-container">
            <p class="highlight-text">
                Shift the overall look and feel by adding these wonderful touches to furniture in your home
            </p>

            <p class="normal-text">
                Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting. I’ve got some simple tips to help you make any room feel complete.
            </p>

        </section>
        <footer class="interaction-container">
            <img src="./src/images/avatar-michelle.jpg" alt="Michelle avatar">
            <div class="interaction-text">
                <p class="name">Michelle Appleton</p>
                <p class="date">28 Jun 2020</p>
            </div>
            <button type="button" title="Share">
                <img src="./src/images/icon-share.svg" alt="Share icon">
            </button>
        </footer>
    </main>
    <script src="./src/script/script.js"></script>
</body>
</html>
